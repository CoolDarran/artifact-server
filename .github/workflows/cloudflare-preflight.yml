name: Cloudflare deployment preflight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check settings, qualify an isolated installation, or deploy production
        required: true
        default: check
        type: choice
        options: [check, qualify, deploy]
  push:
    branches: [deploy/cloudflare-preflight]
    paths: [.github/workflows/cloudflare-preflight.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-deployment-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify Cloudflare deployment prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Check configuration and Cloudflare read access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARTIFACT_SERVER_API_TOKEN: ${{ secrets.ARTIFACT_SERVER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STAGE: ${{ vars.ALCHEMY_STAGE }}
          ARTIFACT_SERVER_OIDC_CLIENT_ID: ${{ vars.ARTIFACT_SERVER_OIDC_CLIENT_ID }}
          ARTIFACT_SERVER_OIDC_ISSUER: ${{ vars.ARTIFACT_SERVER_OIDC_ISSUER }}
          ARTIFACT_SERVER_OIDC_CLIENT_SECRET: ${{ secrets.ARTIFACT_SERVER_OIDC_CLIENT_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';

          const required = [
            'CLOUDFLARE_API_TOKEN',
            'ARTIFACT_SERVER_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'ALCHEMY_STAGE',
            'ARTIFACT_SERVER_OIDC_CLIENT_ID',
            'ARTIFACT_SERVER_OIDC_ISSUER',
            'ARTIFACT_SERVER_OIDC_CLIENT_SECRET',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length > 0) {
            console.error(`Missing GitHub Actions configuration: ${missing.join(', ')}`);
            process.exit(1);
          }
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!/^[a-f0-9]{32}$/.test(accountId)) {
            console.error('CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID.');
            process.exit(1);
          }
          if (process.env.ALCHEMY_STAGE !== 'production') {
            console.error('This installation requires ALCHEMY_STAGE=production.');
            process.exit(1);
          }
          if (process.env.ARTIFACT_SERVER_API_TOKEN.trim().length < 32) {
            console.error('ARTIFACT_SERVER_API_TOKEN must contain at least 32 characters.');
            process.exit(1);
          }

          const clientId = process.env.ARTIFACT_SERVER_OIDC_CLIENT_ID;
          const issuer = process.env.ARTIFACT_SERVER_OIDC_ISSUER;
          if (!/^[a-f0-9]{64}$/.test(clientId)
            || issuer !== `https://danran.cloudflareaccess.com/cdn-cgi/access/sso/oidc/${clientId}`) {
            console.error('OIDC settings must identify this installation’s Cloudflare Access client.');
            process.exit(1);
          }

          const checks = [
            ['Worker inventory', `/accounts/${accountId}/workers/scripts`],
            ['D1 inventory', `/accounts/${accountId}/d1/database`],
            ['R2 inventory', `/accounts/${accountId}/r2/buckets`],
            ['Pages inventory', `/accounts/${accountId}/pages/projects`],
            ['Application DNS zone', `/zones?name=danran.one&account.id=${accountId}`],
          ];
          const rows = [];
          let failed = false;
          for (const [name, path] of checks) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN.trim()}`},
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json();
              let passed = response.ok && body.success === true;
              if (name === 'Application DNS zone') {
                passed = passed && Array.isArray(body.result) && body.result.some(
                  (zone) => zone.name === 'danran.one' && zone.status === 'active'
                    && zone.account?.id === accountId,
                );
              }
              failed ||= !passed;
              const status = passed ? 'PASS' : `FAIL (HTTP ${response.status})`;
              rows.push(`| ${name} | ${status} |`);
              console.log(`${name}: ${status}`);
            } catch {
              failed = true;
              rows.push(`| ${name} | FAIL (request did not complete) |`);
              console.error(`${name}: request did not complete.`);
            }
          }
          try {
            const discoveryResponse = await fetch(`${issuer}/.well-known/openid-configuration`, {
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            });
            const discovery = await discoveryResponse.json();
            const discoveryPassed = discoveryResponse.ok && discovery.issuer === issuer
              && discovery.authorization_endpoint === `${issuer}/authorization`
              && discovery.token_endpoint === `${issuer}/token`
              && discovery.jwks_uri === `${issuer}/jwks`
              && ['openid', 'email', 'profile'].every(
                (scope) => discovery.scopes_supported?.includes(scope),
              )
              && discovery.grant_types_supported?.includes('authorization_code_with_pkce')
              && discovery.response_types_supported?.includes('code')
              && discovery.id_token_signing_alg_values_supported?.includes('RS256');
            if (!discoveryPassed) throw new Error('Discovery does not match the configured client.');
            const keysResponse = await fetch(discovery.jwks_uri, {
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            });
            const keys = await keysResponse.json();
            const passed = keysResponse.ok && Array.isArray(keys.keys) && keys.keys.some(
              (key) => key.kty === 'RSA' && typeof key.kid === 'string' && key.kid.length > 0
                && typeof key.n === 'string' && key.n.length > 0
                && typeof key.e === 'string' && key.e.length > 0,
            );
            failed ||= !passed;
            const status = passed ? 'PASS' : 'FAIL';
            rows.push(`| Cloudflare Access discovery and signing keys | ${status} |`);
            console.log(`Cloudflare Access discovery and signing keys: ${status}`);
          } catch {
            failed = true;
            rows.push('| Cloudflare Access discovery and signing keys | FAIL |');
            console.error('Cloudflare Access discovery or signing-key check failed.');
          }
          const summary = [
            '## Cloudflare deployment preflight',
            '',
            'The seven required GitHub settings are present and structurally valid.',
            '',
            '| Check | Result |',
            '| --- | --- |',
            ...rows,
            '',
            'These GET requests verify read access only. They do not prove create/update permissions.',
            'The check operation creates no resources and does not deploy Artifact Server.',
            '',
            'OIDC discovery and public signing keys are checked without sending the client secret.',
            'Secret presence does not prove its correctness, the Access policy, or a browser login round trip.',
            'The Pages gateway is deployed only when the explicit qualify or deploy operation is selected.',
            'The deploy job builds the application, uses the canonical Alchemy stack, and checks live readiness.',
            '',
          ].join('\n');
          await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          if (failed) process.exitCode = 1;
          NODE

  deploy:
    name: Deploy and verify Cloudflare installation
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'check'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require live qualification of this commit
        if: inputs.operation == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const headers = {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json'};
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const response = await fetch(`${base}/actions/artifacts?name=pages-qualification-${process.env.GITHUB_SHA}&per_page=100`, {headers, redirect: 'error', signal: AbortSignal.timeout(15000)});
          if (!response.ok) throw new Error('Qualification evidence could not be checked.');
          const body = await response.json();
          let qualified = false;
          for (const artifact of body.artifacts ?? []) {
            if (artifact.expired || artifact.workflow_run?.head_sha !== process.env.GITHUB_SHA) continue;
            const runResponse = await fetch(`${base}/actions/runs/${artifact.workflow_run.id}`, {headers, redirect: 'error', signal: AbortSignal.timeout(15000)});
            if (!runResponse.ok) continue;
            const run = await runResponse.json();
            qualified ||= run.conclusion === 'success' && run.path === '.github/workflows/cloudflare-preflight.yml';
          }
          if (!qualified) throw new Error('Run the qualify operation successfully on this exact commit before deploying production.');
          console.log('This commit has successful live Pages qualification.');
          NODE
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Prepare installation configuration
        env:
          OPERATION: ${{ inputs.operation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOOTSTRAP_EMAIL: ${{ vars.ARTIFACT_SERVER_BOOTSTRAP_ADMINISTRATOR_EMAIL }}
          OIDC_CLIENT_ID: ${{ vars.ARTIFACT_SERVER_OIDC_CLIENT_ID }}
          OIDC_ISSUER: ${{ vars.ARTIFACT_SERVER_OIDC_ISSUER }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const production = process.env.OPERATION === 'deploy';
          if (!process.env.BOOTSTRAP_EMAIL?.trim()) throw new Error('The bootstrap administrator email is missing.');
          const response = await fetch(`https://api.cloudflare.com/client/v4/zones?name=danran.one&account.id=${process.env.CLOUDFLARE_ACCOUNT_ID}`, {
            headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          const envelope = await response.json();
          const zone = envelope.result?.find(item => item.name === 'danran.one' && item.status === 'active' && item.account?.id === process.env.CLOUDFLARE_ACCOUNT_ID);
          if (!response.ok || envelope.success !== true || !zone) throw new Error('The application DNS zone could not be resolved.');
          const projectName = production ? 'danran-artifact-content' : 'as-pages-runtime-probe';
          const configuration = {
            applicationDomain: production ? 'artifacts.danran.one' : 'probe-artifacts.danran.one',
            backupRetentionDays: production ? 14 : 7,
            bootstrapAdministratorEmail: process.env.BOOTSTRAP_EMAIL.trim(),
            capacity: {cpu: 1, maximumInstances: 1, memoryMiB: 128, minimumInstances: production ? 1 : 0},
            cloudflareAccountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            compatibilityDate: '2026-08-15',
            contentDomain: `${projectName}.pages.dev`,
            contentOrigin: {kind: 'cloudflare-pages', projectName},
            databasePlan: 'small', deletionProtection: production,
            dnsZoneIds: {application: zone.id},
            environment: production ? 'production' : 'development',
            ingress: 'public', installationName: production ? 'danran-artifacts' : 'pages',
            region: 'global', stage: production ? 'production' : 'probe-runtime-pages',
            stateStore: 'cloudflare', target: 'cloudflare',
            ...(production ? {
              oidcClientId: process.env.OIDC_CLIENT_ID,
              oidcClientSecretRef: 'cloudflare-secrets-store://artifact-server-oidc-client-secret',
              oidcIssuer: process.env.OIDC_ISSUER, oidcScopes: 'openid email profile',
            } : {}),
          };
          await appendFile(process.env.GITHUB_ENV, `ARTIFACT_SERVER_CLOUDFLARE_CONFIG=${JSON.stringify(configuration)}\nALCHEMY_STAGE=${configuration.stage}\nARTIFACT_SERVER_APPLICATION_ORIGIN=https://${configuration.applicationDomain}\n`);
          NODE
      - name: Apply canonical Alchemy stack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACT_SERVER_API_TOKEN: ${{ secrets.ARTIFACT_SERVER_API_TOKEN }}
          ARTIFACT_SERVER_OIDC_CLIENT_SECRET: ${{ secrets.ARTIFACT_SERVER_OIDC_CLIENT_SECRET }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: pnpm --dir deploy/cloudflare deploy --yes --stage "$ALCHEMY_STAGE"
      - name: Check live Pages publication and authorization
        if: inputs.operation == 'qualify'
        env:
          ARTIFACT_SERVER_API_TOKEN: ${{ secrets.ARTIFACT_SERVER_API_TOKEN }}
        run: node deploy/cloudflare/scripts/verify-pages-runtime.mjs | tee "$RUNNER_TEMP/pages-runtime-qualification.txt"
      - name: Save successful qualification
        if: inputs.operation == 'qualify'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/pages-runtime-qualification.txt
          retention-days: 2
          if-no-files-found: error
      - name: Check production readiness and login redirect
        if: inputs.operation == 'deploy'
        run: |
          node --input-type=module <<'NODE'
          for (const path of ['/health', '/ready', '/auth/login']) {
            const response = await fetch(`${process.env.ARTIFACT_SERVER_APPLICATION_ORIGIN}${path}`, {
              redirect: 'manual', signal: AbortSignal.timeout(30000),
            });
            const expected = path === '/auth/login' ? 302 : 200;
            if (response.status !== expected) throw new Error(`${path} returned HTTP ${response.status}; expected ${expected}.`);
            await response.body?.cancel();
            console.log(`${path}: PASS`);
          }
          NODE
