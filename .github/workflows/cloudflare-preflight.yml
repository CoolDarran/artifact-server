name: Cloudflare deployment preflight

on:
  workflow_dispatch:
  push:
    branches: [deploy/cloudflare-preflight]
    paths: [.github/workflows/cloudflare-preflight.yml]

permissions:
  contents: read

concurrency:
  group: cloudflare-deployment-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify Cloudflare deployment prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Check configuration and Cloudflare read access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARTIFACT_SERVER_API_TOKEN: ${{ secrets.ARTIFACT_SERVER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STAGE: ${{ vars.ALCHEMY_STAGE }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';

          const required = [
            'CLOUDFLARE_API_TOKEN',
            'ARTIFACT_SERVER_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'ALCHEMY_STAGE',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length > 0) {
            console.error(`Missing GitHub Actions configuration: ${missing.join(', ')}`);
            process.exit(1);
          }
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!/^[a-f0-9]{32}$/.test(accountId)) {
            console.error('CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID.');
            process.exit(1);
          }
          if (process.env.ALCHEMY_STAGE !== 'production') {
            console.error('This installation requires ALCHEMY_STAGE=production.');
            process.exit(1);
          }
          if (process.env.ARTIFACT_SERVER_API_TOKEN.trim().length < 32) {
            console.error('ARTIFACT_SERVER_API_TOKEN must contain at least 32 characters.');
            process.exit(1);
          }

          const checks = [
            ['Worker inventory', `/accounts/${accountId}/workers/scripts`],
            ['D1 inventory', `/accounts/${accountId}/d1/database`],
            ['R2 inventory', `/accounts/${accountId}/r2/buckets`],
            ['Pages inventory', `/accounts/${accountId}/pages/projects`],
            ['Application DNS zone', `/zones?name=danran.one&account.id=${accountId}`],
          ];
          const rows = [];
          let failed = false;
          for (const [name, path] of checks) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN.trim()}`},
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json();
              let passed = response.ok && body.success === true;
              if (name === 'Application DNS zone') {
                passed = passed && Array.isArray(body.result) && body.result.some(
                  (zone) => zone.name === 'danran.one' && zone.status === 'active'
                    && zone.account?.id === accountId,
                );
              }
              failed ||= !passed;
              const status = passed ? 'PASS' : `FAIL (HTTP ${response.status})`;
              rows.push(`| ${name} | ${status} |`);
              console.log(`${name}: ${status}`);
            } catch {
              failed = true;
              rows.push(`| ${name} | FAIL (request did not complete) |`);
              console.error(`${name}: request did not complete.`);
            }
          }
          const summary = [
            '## Cloudflare deployment preflight',
            '',
            'The four required GitHub settings are present and structurally valid.',
            '',
            '| Check | Result |',
            '| --- | --- |',
            ...rows,
            '',
            'These GET requests verify read access only. They do not prove create/update permissions.',
            'This workflow creates no resources and does not deploy Artifact Server.',
            '',
            'Deployment remains pending: the Pages content gateway must be integrated with the real application,',
            'browser login must be configured, and the application qualification checks must pass.',
            'The existing Alchemy entrypoint requires two owned DNS zones; do not use it with a pages.dev zone ID.',
            '',
          ].join('\n');
          await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          if (failed) process.exitCode = 1;
          NODE
